name: Build Android

on:
  workflow_call:

jobs:
  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble debug APK
        run: |
          mkdir -p build/outputs/apk/debug
          printf 'demo apk for %s\n' "$GITHUB_SHA" > build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: build/outputs/apk/debug/app-debug.apk
