name: Quality

on:
  workflow_call:
    inputs:
      fail:
        description: Simula reprovação na qualidade.
        required: false
        type: boolean
        default: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source
        run: test -f README.md
      - name: Run quality gate
        run: |
          if [[ "${{ inputs.fail }}" == "true" ]]; then
            echo "Quality gate reprovado: falha sintética"
            exit 23
          fi
          echo "Quality gate aprovado"
