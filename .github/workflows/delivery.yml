name: Delivery pipeline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Cenário a demonstrar no trace OTEL.
        required: true
        type: choice
        default: success
        options: [success, quality_failure, build_failure, security_failure, deploy_failure]

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      fail: ${{ inputs.scenario == 'quality_failure' }}

  build_android:
    needs: quality
    uses: ./.github/workflows/build-android.yml
    with:
      fail: ${{ inputs.scenario == 'build_failure' }}

  security:
    needs: quality
    uses: ./.github/workflows/security.yml
    with:
      fail: ${{ inputs.scenario == 'security_failure' }}

  deploy:
    if: ${{ always() && needs.quality.result == 'success' && needs.build_android.result == 'success' && needs.security.result == 'success' }}
    needs: [quality, build_android, security]
    uses: ./.github/workflows/deploy.yml
    with:
      fail: ${{ inputs.scenario == 'deploy_failure' }}
