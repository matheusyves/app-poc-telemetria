name: Security

on:
  workflow_call:

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate SBOM evidence
        run: |
          printf '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
